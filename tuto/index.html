<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Tuto ClearCup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    a {
      display: inline-block;
      color: #fff;
      background: #111;
      border: 2px solid #fff;
      border-radius: 50px;
      padding: 18px 40px;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: 0.03em;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
  <script>
    /* Redirection immédiate vers le fichier MP4 → lecteur natif */
    window.location.replace('tuto-clearcup.mp4');
  </script>
</head>
<body>
  <!-- Fallback si la redirection JS est bloquée -->
  <a href="tuto-clearcup.mp4">▶ Voir le tutoriel</a>
</body>
</html>
