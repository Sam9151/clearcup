[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Rangement du 07.09.2026 : ASSET_CC/ -> assets/, TYPO/ -> fonts/. Redirections
# gardées pour les liens déjà partagés (og:image en cache Facebook/Twitter,
# manifestes PWA déjà installés) et l'indexation Google Images existante.
[[redirects]]
  from = "/ASSET_CC/*"
  to = "/assets/:splat"
  status = 301

[[redirects]]
  from = "/TYPO/*"
  to = "/fonts/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
