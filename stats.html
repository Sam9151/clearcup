<!--
  ============================================================================
  STATS.HTML — dashboard admin pour "Lâche pas". Fichier unique, pas de build
  step, même philosophie que game.html — mais CONTRAIREMENT à game.html,
  cette page PARLE DIRECTEMENT à Firebase (Auth + Realtime Database) : le
  découplage localStorage/événement de game.html existe pour que le jeu
  reste jouable hors-ligne, une contrainte qui n'a aucun sens ici (page
  admin, forcément en ligne).

  Refonte du 07.09.2026 (retours de tests) — voir docs/game/README-game.md
  pour le détail des bugs corrigés côté game.html/lp-firebase.js (parties
  qui ne s'enregistraient pas, pseudos jamais capturés). Côté stats.html :
  - Temps réel (onValue) au lieu d'un chargement ponctuel (get()) — plus de
    bouton "Actualiser", tout se met à jour tout seul.
  - Classement affiché directement sur l'écran principal (avant : pop-up
    séparée), filtré aux seuls joueurs ayant renseigné un pseudo Instagram
    (les parties anonymes comptent toujours dans "Parties jouées" et les
    autres stats, elles disparaissent seulement du classement).
  - Gestion complète des festivals : créer, activer, renommer, supprimer
    (avant : création + activation seulement, décision v1 revue par Sam).
  - Simplifié : suppression de "Temps médian", "Causes de perte" et
    "Distractions qui font le plus perdre" (demande explicite de Sam —
    "le plus simple possible, quitte à enlever des stats").

  Deuxième refonte du 07.09.2026 (même jour, retour "l'authentification ne
  sert à rien puisque le code est public") : la config Firebase est en
  effet toujours visible côté client (normal, ce n'est pas un secret, voir
  toute appli Firebase) — mais ça n'a jamais été le rôle de l'authentification
  ici, qui protège la LECTURE/ÉCRITURE via les règles Realtime Database, pas
  le code. Décision retenue (choix explicite de Sam) : lecture PUBLIQUE
  (classement + stats visibles par n'importe qui, sans connexion — pratique
  pour un écran affiché en direct au festival), gestion des festivals
  (créer/renommer/supprimer/activer) toujours réservée à l'admin connecté.
  Plus de page de connexion plein écran bloquante : le dashboard s'affiche
  tout de suite, une zone "Connexion admin" discrète (voir #login-card)
  révèle le formulaire à la demande et fait apparaître les boutons de
  gestion une fois connecté.

  Sécurité : voir lp-firebase.js pour les règles Realtime Database à jour
  ("runs" et "festivals" en lecture publique désormais, écriture de
  "festivals" toujours réservée à "auth != null").
  ============================================================================
-->

<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --white:#FFFFFF;
    --ink:#0A0A0A;
    --blue:#64A4F6;
    --border:2px solid var(--ink);
    --radius:16px;
    --shadow:4px 4px 0 var(--ink);

    src:url('fonts/lp-bagel-fat-one.woff2') format('woff2');
    font-weight:400; font-style:normal; font-display:swap;

  html,body{ margin:0; padding:0; }

  .card{

  }

  input[type="email"], input[type="password"], input[type="text"]{

    border:var(--border);

  #login-card{ max-width:360px; }

  #login-card label:first-of-type{ margin-top:0; }

<body>

<!-- ============ Dashboard — lecture publique, gestion réservée à l'admin ============ -->
<div id="view-dashboard">
  <div class="wrap">
    <header class="top">
      <h1>Lâche pas — Stats</h1>
      <div id="admin-zone">
        <button type="button" class="btn btn--white btn--sm" id="btn-toggle-login">Connexion admin</button>
        <button type="button" class="btn btn--white btn--sm" id="btn-logout" hidden>Se déconnecter</button>
      </div>
    </header>

    <!-- Repliée par défaut : seule la gestion (créer/renommer/supprimer un
         festival, changer le mode actif) est réservée à l'admin — le
         classement et les stats ci-dessous restent visibles sans connexion. -->
    <div class="card" id="login-card" hidden>
      <form id="form-login">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" autocomplete="username" required>
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
        <p id="login-error"></p>
        <button type="submit" class="btn" id="btn-login">Se connecter</button>
      </form>
    </div>

    <p id="banner-error"></p>

    <div class="active-banner" id="active-banner">Mode actif : —</div>

    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:.75rem;">Classements</h2>
      <div id="scope-list"><p class="empty-note">Chargement…</p></div>
      <div class="new-festival" id="new-festival-row" hidden>
        <input type="text" id="input-new-festival" placeholder="Nom du nouveau festival" maxlength="80">
        <button type="button" class="btn btn--sm" id="btn-create-festival">+ Créer</button>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:.5rem;">Classement</h2>
      <p class="empty-note" id="scope-selected-label">Général</p>
      <ol id="classement-list"><li class="empty-note" style="border:none;">Aucune partie enregistrée pour ce classement.</li></ol>
    </div>

    <div class="card">
      <h2 style="font-size:1.1rem; margin-bottom:.5rem;">Statistiques</h2>
      <div class="stat-grid">
        <div class="stat-tile"><span class="num" id="stat-total">—</span><span class="label">Parties jouées</span></div>
        <div class="stat-tile"><span class="num" id="stat-avg">—</span><span class="label">Temps moyen</span></div>
        <div class="stat-tile"><span class="num" id="stat-cap">—</span><span class="label">Arrivés au bout</span></div>
      </div>
    </div>
  </div>
</div>

<script src="lp-firebase-config.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { getDatabase, ref, onValue, push, set, update, remove, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

function $(id){ return document.getElementById(id); }

if (!window.LP_FIREBASE_CONFIG){
  document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif;">lp-firebase-config.js absent — configuration Firebase introuvable.</p>';
  throw new Error('LP_FIREBASE_CONFIG absent');
}
var app = initializeApp(window.LP_FIREBASE_CONFIG);
var auth = getAuth(app);
var db = getDatabase(app);

/* ============================================================================
   ÉTAT LOCAL — alimenté en continu par les écouteurs temps réel (voir
   startListeners() plus bas), jamais rechargé "à la main".
   ============================================================================ */
var state = {
  festivals: {},         // { festivalId: { name, createdAt } }
  activeFestivalId: '',  // '' = mode Général
  selectedScope: '',     // '' = Général, sinon un festivalId — ce qu'on est en train de regarder
  runs: [],               // toutes les parties, mises à jour en direct depuis /runs
  isAdmin: false          // connecté (Firebase Auth) — contrôle uniquement l'affichage des actions
                          // de gestion (créer/renommer/supprimer/activer) ; lecture toujours publique
};

function showError(msg){
  var el = $('banner-error');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

/* ============================================================================
   CONNEXION ADMIN — n'affecte plus l'accès en lecture (classement/stats
   visibles par tout le monde, voir startListeners() appelé sans condition
   plus bas) : sert uniquement à débloquer les actions de gestion des
   festivals (créer/renommer/supprimer/activer), toujours protégées côté
   règles Firebase par "auth != null". Carte repliée par défaut, ouverte via
   le bouton "Connexion admin" dans l'en-tête.
   ============================================================================ */
$('btn-toggle-login').addEventListener('click', function(){
  $('login-card').hidden = !$('login-card').hidden;
});

$('form-login').addEventListener('submit', function(e){
  e.preventDefault();
  $('login-error').textContent = '';
  $('btn-login').disabled = true;
  signInWithEmailAndPassword(auth, $('login-email').value.trim(), $('login-password').value)
    .then(function(){
      $('form-login').reset();
      $('login-card').hidden = true;
    })
    .catch(function(err){
      $('login-error').textContent = "Connexion impossible — vérifie l'e-mail et le mot de passe.";
      console.warn('[stats] échec connexion', err);
    })
    .finally(function(){ $('btn-login').disabled = false; });
});

$('btn-logout').addEventListener('click', function(){ signOut(auth); });

onAuthStateChanged(auth, function(user){
  state.isAdmin = !!user;
  $('btn-toggle-login').hidden = !!user;
  $('btn-logout').hidden = !user;
  $('new-festival-row').hidden = !user;
  renderScopeList(); // seule vue qui dépend de isAdmin (boutons Activer/✎/🗑)
});

/* ============================================================================
   TEMPS RÉEL — trois écoutes indépendantes (onValue), chacune redessine ce
   qui dépend d'elle dès que Firebase pousse un changement. Remplace l'ancien
   loadAll() sur get() + bouton "Actualiser" (décision explicite revue par
   Sam le 07.09.2026 : le classement doit être à jour tout seul, vite).
   Démarrées une seule fois, tout de suite (appel juste après cette
   définition) : la lecture est publique désormais, plus besoin d'attendre
   une connexion admin pour afficher classement/stats.
   ============================================================================ */
var unsubscribers = [];

function startListeners(){
  if (unsubscribers.length) return; // déjà démarré, ne rien dupliquer

  unsubscribers.push(onValue(ref(db, 'festivals'), function(snap){
    state.festivals = snap.exists() ? snap.val() : {};
    // Le festival regardé peut avoir été supprimé entre-temps (par cette
    // session ou une autre) : on retombe sur Général plutôt que d'afficher
    // un classement fantôme.
    if (state.selectedScope && !state.festivals[state.selectedScope]) state.selectedScope = '';
    renderScopeList();
    renderActiveBanner();
    renderClassement();
    renderStats();
    showError('');
  }, function(err){
    console.warn('[stats] festivals:', err && err.message);
    showError("Connexion à Firebase perdue (festivals) : " + (err && err.message ? err.message : err));
  }));

  unsubscribers.push(onValue(ref(db, 'activeFestivalId'), function(snap){
    state.activeFestivalId = snap.exists() ? (snap.val() || '') : '';
    renderActiveBanner();
    renderScopeList();
  }, function(err){
    console.warn('[stats] activeFestivalId:', err && err.message);
  }));

  unsubscribers.push(onValue(ref(db, 'runs'), function(snap){
    var runsObj = snap.exists() ? snap.val() : {};
    state.runs = Object.keys(runsObj).map(function(id){
      var r = runsObj[id];
      r.id = id;
      return r;
    });
    renderClassement();
    renderStats();
    showError('');
  }, function(err){
    console.warn('[stats] runs:', err && err.message);
    showError("Connexion à Firebase perdue (parties) : " + (err && err.message ? err.message : err));
  }));
}

startListeners();

/* ============================================================================
   FESTIVALS — créer, activer, renommer, supprimer (actions réservées à
   l'admin connecté, boutons masqués sinon — voir renderScopeList()). Les
   règles Firebase ("auth != null" sur festivals.write) referment de toute
   façon la porte côté serveur si jamais un appel arrivait sans connexion.
   ============================================================================ */
$('btn-create-festival').addEventListener('click', function(){
  var name = $('input-new-festival').value.trim();
  if (!name) return;
  $('btn-create-festival').disabled = true;
  var newRef = push(ref(db, 'festivals'));
  set(newRef, { name: name, createdAt: serverTimestamp() })
    .then(function(){ $('input-new-festival').value = ''; })
    .catch(function(err){ alert('Création impossible : ' + (err && err.message ? err.message : err)); })
    .finally(function(){ $('btn-create-festival').disabled = false; });
});

function activateScope(festivalId){
  set(ref(db, 'activeFestivalId'), festivalId || null)
    .catch(function(err){ alert('Activation impossible : ' + (err && err.message ? err.message : err)); });
}

function renameFestival(id){
  var current = festivalName(id);
  var name = prompt('Nouveau nom pour "' + current + '" :', current);
  if (name === null) return; // annulé
  name = name.trim();
  if (!name || name === current) return;
  update(ref(db, 'festivals/' + id), { name: name })
    .catch(function(err){ alert('Renommage impossible : ' + (err && err.message ? err.message : err)); });
}

function deleteFestival(id){
  var name = festivalName(id);
  if (!confirm('Supprimer "' + name + '" ? Les parties déjà enregistrées le gardent en référence (elles afficheront juste "Festival supprimé"), mais le classement dédié disparaît.')) return;
  var wasActive = state.activeFestivalId === id;
  remove(ref(db, 'festivals/' + id))
    .then(function(){
      if (wasActive) return set(ref(db, 'activeFestivalId'), '');
    })
    .then(function(){
      if (state.selectedScope === id) state.selectedScope = '';
    })
    .catch(function(err){ alert('Suppression impossible : ' + (err && err.message ? err.message : err)); });
}

/* ============================================================================
   AFFICHAGE — liste des classements + bannière du mode actif
   ============================================================================ */
function festivalName(id){
  if (!id) return 'Général';
  return (state.festivals[id] && state.festivals[id].name) || 'Festival supprimé';
}

function renderActiveBanner(){
  $('active-banner').textContent = 'Mode actif : ' + festivalName(state.activeFestivalId);
}

function renderScopeList(){
  var ids = Object.keys(state.festivals).sort(function(a, b){
    return (state.festivals[b].createdAt || 0) - (state.festivals[a].createdAt || 0);
  });
  var scopes = [''].concat(ids); // '' = Général, toujours en premier

  var html = scopes.map(function(id){
    var isActive = id === (state.activeFestivalId || '');
    var isSelected = id === state.selectedScope;
    // Boutons de gestion masqués pour un visiteur non connecté — lecture
    // (nom, badge "en cours", sélection du classement) reste toujours publique.
    var actions = !state.isAdmin ? '' :
      (isActive ? '' : '<button type="button" class="btn btn--white btn--sm" data-activate="' + id + '">Activer</button>') +
      (id ? '<button type="button" class="btn btn--white btn--sm btn--icon" data-rename="' + id + '" aria-label="Renommer">✎</button>' : '') +
      (id ? '<button type="button" class="btn btn--white btn--sm btn--icon" data-delete="' + id + '" aria-label="Supprimer">🗑</button>' : '');
    return '<div class="scope-row' + (isSelected ? ' is-selected' : '') + '">' +
      '<button type="button" class="scope-name-btn" data-scope="' + id + '">' +
        escapeHtml(festivalName(id)) +
        (isActive ? '<span class="scope-badge">● En cours</span>' : '') +
      '</button>' +
      '<div class="scope-actions">' + actions + '</div>' +
    '</div>';
  }).join('');
  $('scope-list').innerHTML = html;

  $('scope-list').querySelectorAll('[data-scope]').forEach(function(btn){
    btn.addEventListener('click', function(){
      state.selectedScope = btn.getAttribute('data-scope');
      renderScopeList();
      renderClassement();
      renderStats();
    });
  });
  if (state.isAdmin){
    $('scope-list').querySelectorAll('[data-activate]').forEach(function(btn){
      btn.addEventListener('click', function(){ activateScope(btn.getAttribute('data-activate')); });
    });
    $('scope-list').querySelectorAll('[data-rename]').forEach(function(btn){
      btn.addEventListener('click', function(){ renameFestival(btn.getAttribute('data-rename')); });
    });
    $('scope-list').querySelectorAll('[data-delete]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteFestival(btn.getAttribute('data-delete')); });
    });
  }
}

/* ============================================================================
   STATS — scopées sur state.selectedScope. Simplifié le 07.09.2026 (demande
   explicite de Sam) : seuls le nb de parties, le temps moyen et le % arrivés
   au bout restent. L'ancien détail (temps médian, répartition des causes de
   perte, distractions qui font le plus perdre) a été retiré.
   ============================================================================ */
function fmtSec(ms){ return (ms / 1000).toFixed(1).replace('.', ',') + ' s'; }

// Échappement HTML — toute donnée provenant de /runs (handle…) est écrite
// côté client sans authentification (règles Firebase : create public), donc
// jamais fiable telle quelle avant une insertion via innerHTML. Les noms de
// festival (admin uniquement) n'ont pas ce risque mais passent par la même
// fonction par cohérence/simplicité.
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function scopedRuns(){
  var scope = state.selectedScope || '';
  return state.runs.filter(function(r){ return (r.festivalId || '') === scope; });
}

function renderStats(){
  var runs = scopedRuns();
  var total = runs.length;

  $('stat-total').textContent = total;

  if (!total){
    $('stat-avg').textContent = '—';
    $('stat-cap').textContent = '—';
    return;
  }

  var scores = runs.map(function(r){ return r.scoreMs || 0; });
  var avgMs = scores.reduce(function(s, v){ return s + v; }, 0) / total;
  $('stat-avg').textContent = fmtSec(avgMs);

  var capCount = runs.filter(function(r){ return r.cause === 'cap'; }).length;
  $('stat-cap').textContent = capCount + ' (' + Math.round(capCount / total * 100) + ' %)';
}

/* ============================================================================
   CLASSEMENT — top 10 PAR JOUEUR (meilleur score de chaque clientId, pas 10
   lignes du même joueur qui aurait rejoué plusieurs fois), filtré aux seuls
   joueurs ayant renseigné un pseudo Instagram (demande explicite de Sam —
   un joueur anonyme compte dans "Parties jouées" mais n'apparaît pas ici).
   Affiché directement dans la carte "Classement" (avant : pop-up séparée,
   ouverte à la demande — plus nécessaire vu que tout est temps réel).
   ============================================================================ */
function topTen(){
  var best = {}; // clientId -> meilleure run, uniquement parmi celles avec un handle
  scopedRuns().filter(function(r){ return !!r.handle; }).forEach(function(r){
    var key = r.clientId || r.id;
    if (!best[key] || (r.scoreMs || 0) > (best[key].scoreMs || 0)) best[key] = r;
  });
  return Object.keys(best).map(function(k){ return best[k]; })
    .sort(function(a, b){ return (b.scoreMs || 0) - (a.scoreMs || 0); })
    .slice(0, 10);
}

function renderClassement(){
  $('scope-selected-label').textContent = festivalName(state.selectedScope);
  var list = topTen();
  if (!list.length){
    $('classement-list').innerHTML = '<li class="empty-note" style="border:none;">Aucune partie avec pseudo pour ce classement.</li>';
    return;
  }
  $('classement-list').innerHTML = list.map(function(r, i){
    return '<li><span class="rank">' + (i + 1) + '</span>' +
      '<span class="rank-handle">@' + escapeHtml(r.handle) + '</span>' +
      '<span class="rank-time">' + fmtSec(r.scoreMs || 0) + '</span></li>';
  }).join('');
}
</script>
